<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>透明余白自動トリミング ＆ リサイズ</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background-color: #f4f6f8;
      color: #333;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 950px;
      margin: 0 auto;
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 20px;
      text-align: center;
      color: #2c3e50;
    }
    .drop-zone {
      border: 2px dashed #007bff;
      border-radius: 8px;
      padding: 30px 20px;
      text-align: center;
      background: #f8faff;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }
    .drop-zone:hover, .drop-zone.dragover {
      background: #eef5ff;
      border-color: #0056b3;
    }
    .drop-zone p {
      margin: 0;
      font-size: 1rem;
      color: #666;
    }
    input[type="file"] {
      display: none;
    }
    .preview-list {
      margin-top: 30px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .preview-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid #e1e8ed;
      padding: 15px 20px;
      border-radius: 8px;
      background: #fff;
      gap: 20px;
      flex-wrap: wrap;
    }
    .img-container {
      width: 120px;
      height: 120px;
      background-image: 
        linear-gradient(45deg, #ccc 25%, transparent 25%), 
        linear-gradient(-45deg, #ccc 25%, transparent 25%), 
        linear-gradient(45deg, transparent 75%, #ccc 75%), 
        linear-gradient(-45deg, transparent 75%, #ccc 75%);
      background-size: 16px 16px;
      background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
      border: 1px solid #ddd;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }
    .img-container img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    .preview-card-info {
      flex: 1;
      min-width: 250px;
      font-size: 0.9rem;
    }
    .preview-card-info .title {
      font-weight: bold;
      margin-bottom: 8px;
      word-break: break-all;
    }
    .preview-card-info .size-info {
      color: #666;
      font-size: 0.85rem;
      margin-bottom: 12px;
    }
    .resize-controls {
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: #f8f9fa;
      padding: 10px 12px;
      border-radius: 6px;
      border: 1px solid #e9ecef;
    }
    .resize-controls label {
      font-size: 0.85rem;
      cursor: pointer;
      user-select: none;
    }
    .input-group {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
    }
    .input-group input[type="number"] {
      width: 75px;
      padding: 4px 6px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.85rem;
    }
    .action-area {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: center;
      gap: 10px;
    }
    .btn-download {
      background-color: #28a745;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: bold;
      text-decoration: none;
      text-align: center;
      transition: background 0.2s;
    }
    .btn-download:hover {
      background-color: #218838;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>透明余白 自動トリミング＆リサイズ</h1>
  
  <div class="drop-zone" id="dropZone">
    <p>ここに透明背景のPNG画像をドラッグ＆ドロップ<br>またはクリックしてファイルを選択（複数可）</p>
    <input type="file" id="fileInput" accept="image/png, image/webp" multiple>
  </div>

  <div class="preview-list" id="previewList"></div>
</div>

<script>
  const dropZone = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');
  const previewList = document.getElementById('previewList');

  dropZone.addEventListener('click', () => fileInput.click());

  dropZone.addEventListener('dragover', (e) => {
    e.preventDefault();
    dropZone.classList.add('dragover');
  });

  dropZone.addEventListener('dragleave', () => {
    dropZone.classList.remove('dragover');
  });

  dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    if (e.dataTransfer.files.length) {
      handleFiles(e.dataTransfer.files);
    }
  });

  fileInput.addEventListener('change', (e) => {
    if (e.target.files.length) {
      handleFiles(e.target.files);
    }
  });

  function handleFiles(files) {
    Array.from(files).forEach(file => {
      if (file.type === 'image/png' || file.type === 'image/webp') {
        processImage(file);
      } else {
        alert('PNGまたはWebP画像を選択してください。');
      }
    });
  }

  function processImage(file) {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = img.width;
        canvas.height = img.height;
        ctx.drawImage(img, 0, 0);

        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = imgData.data;

        let minX = canvas.width, minY = canvas.height;
        let maxX = 0, maxY = 0;
        let hasContent = false;

        for (let y = 0; y < canvas.height; y++) {
          for (let x = 0; x < canvas.width; x++) {
            const alpha = data[(y * canvas.width + x) * 4 + 3];
            if (alpha > 0) {
              if (x < minX) minX = x;
              if (x > maxX) maxX = x;
              if (y < minY) minY = y;
              if (y > maxY) maxY = y;
              hasContent = true;
            }
          }
        }

        if (!hasContent) {
          alert(`「${file.name}」には透明でないピクセルが見つかりませんでした。`);
          return;
        }

        const trimmedWidth = maxX - minX + 1;
        const trimmedHeight = maxY - minY + 1;

        const trimmedCanvas = document.createElement('canvas');
        const trimmedCtx = trimmedCanvas.getContext('2d');
        trimmedCanvas.width = trimmedWidth;
        trimmedCanvas.height = trimmedHeight;

        trimmedCtx.drawImage(
          canvas, 
          minX, minY, trimmedWidth, trimmedHeight, 
          0, 0, trimmedWidth, trimmedHeight
        );

        createPreviewCard(file.name, img.width, img.height, trimmedCanvas, trimmedWidth, trimmedHeight);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function createPreviewCard(fileName, origW, origH, trimmedCanvas, trimmedW, trimmedH) {
    const card = document.createElement('div');
    card.className = 'preview-card';

    const cardId = 'card_' + Math.random().toString(36).substr(2, 9);

    card.innerHTML = `
      <div class="img-container">
        <img id="img_${cardId}" src="" alt="Preview">
      </div>
      <div class="preview-card-info">
        <div class="title">${fileName}</div>
        <div class="size-info">元サイズ: ${origW}×${origH}px → 余白削除後: ${trimmedW}×${trimmedH}px</div>
        
        <div class="resize-controls">
          <label>
            <input type="checkbox" id="keepAspect_${cardId}" checked>
            縦横比を固定する
          </label>
          <div class="input-group">
            幅: <input type="number" id="width_${cardId}" value="${trimmedW}" min="1"> px
            ×
            高さ: <input type="number" id="height_${cardId}" value="${trimmedH}" min="1"> px
          </div>
        </div>
      </div>
      <div class="action-area">
        <button id="btn_${cardId}" class="btn-download">保存 / 共有する</button>
      </div>
    `;

    previewList.prepend(card);

    const imgElem = card.querySelector(`#img_${cardId}`);
    const keepAspectCheck = card.querySelector(`#keepAspect_${cardId}`);
    const widthInput = card.querySelector(`#width_${cardId}`);
    const heightInput = card.querySelector(`#height_${cardId}`);
    const downloadBtn = card.querySelector(`#btn_${cardId}`);

    const aspectRatio = trimmedW / trimmedH;
    let currentBlob = null;
    let currentFileName = '';

    function updateResizedImage() {
      let targetW = parseInt(widthInput.value) || 1;
      let targetH = parseInt(heightInput.value) || 1;

      const outputCanvas = document.createElement('canvas');
      outputCanvas.width = targetW;
      outputCanvas.height = targetH;
      const ctx = outputCanvas.getContext('2d');

      ctx.drawImage(trimmedCanvas, 0, 0, trimmedW, trimmedH, 0, 0, targetW, targetH);

      const nameWithoutExt = fileName.substring(0, fileName.lastIndexOf('.')) || fileName;
      currentFileName = `${nameWithoutExt}_${targetW}x${targetH}.png`;

      // CanvasからBlobオブジェクトを作成
      outputCanvas.toBlob((blob) => {
        currentBlob = blob;
        imgElem.src = URL.createObjectURL(blob);
      }, 'image/png');
    }

    // 保存ボタンクリック時のダイアログ・共有処理
    downloadBtn.addEventListener('click', async () => {
      if (!currentBlob) return;

      const file = new File([currentBlob], currentFileName, { type: 'image/png' });

      // スマホ（iOS/Android）のWeb Share APIが利用可能な場合
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({
            files: [file],
            title: '画像を保存',
          });
        } catch (err) {
          if (err.name !== 'AbortError') {
            console.error(err);
          }
        }
      } else {
        // PCや非対応ブラウザの場合（通常の自動ダウンロード）
        const a = document.createElement('a');
        a.href = URL.createObjectURL(currentBlob);
        a.download = currentFileName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      }
    });

    widthInput.addEventListener('input', () => {
      if (keepAspectCheck.checked && widthInput.value) {
        heightInput.value = Math.round(widthInput.value / aspectRatio);
      }
      updateResizedImage();
    });

    heightInput.addEventListener('input', () => {
      if (keepAspectCheck.checked && heightInput.value) {
        widthInput.value = Math.round(heightInput.value * aspectRatio);
      }
      updateResizedImage();
    });

    keepAspectCheck.addEventListener('change', () => {
      if (keepAspectCheck.checked) {
        heightInput.value = Math.round(widthInput.value / aspectRatio);
        updateResizedImage();
      }
    });

    updateResizedImage();
  }
</script>

</body>
</html>
